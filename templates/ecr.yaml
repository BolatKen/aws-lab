AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository for the orders API (immutable tags, lifecycle policy)

Resources:
  OrdersRepo:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepoName:
    Description: Repository name, passed to the app stack
    Value: !Ref OrdersRepo
  RepoUri:
    Value: !GetAtt OrdersRepo.RepositoryUri
